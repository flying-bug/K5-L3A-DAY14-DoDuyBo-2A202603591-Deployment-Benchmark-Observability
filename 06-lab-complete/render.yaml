# ============================================================
# Render Blueprint — thay thế railway.toml nếu deploy bằng Render.
# Push repo lên GitHub → Render Dashboard → New → Blueprint → chọn repo.
# Secret (AGENT_API_KEY) dùng generateValue/sync:false, điền giá trị thật
# trong Render Dashboard, KHÔNG ghi thẳng ở đây.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "10"
      - key: REDIS_URL
        sync: false
