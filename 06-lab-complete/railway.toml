# ============================================================
# Railway deploy config — xem thêm README.md mục "Deploy".
# Set các biến môi trường bí mật (AGENT_API_KEY, ...) bằng
# `railway variables set KEY=value`, KHÔNG ghi giá trị thật ở đây.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
